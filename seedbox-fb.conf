location /seedbox-fb {
  return 301 /seedbox-fb/;
}

location /seedbox-fb/ {
    proxy_pass       http://127.0.0.1:13030/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_redirect off;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
}

location /seedbox-fb/api/mi {
    proxy_pass       http://127.0.0.1:13031/api/mi;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location /seedbox-fb/api/ss {
    proxy_pass       http://127.0.0.1:13032/api/ss;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location /seedbox-fb/__asp_ss__/ {
    alias /tmp/asp_screens/;
    autoindex off;
    add_header Cache-Control "no-store";
}